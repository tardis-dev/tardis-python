name: Publish New Release To PyPI

on:
  release:
    types: [published]

permissions: {}

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build And Test Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Release Tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$RELEASE_VERSION" == v* ]]; then
            echo "Release tag must be a plain semver version without a v prefix: $RELEASE_VERSION" >&2
            exit 1
          fi

          release_commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$release_commit" "origin/${DEFAULT_BRANCH}"; then
            echo "Release tag must point to a commit in the ${DEFAULT_BRANCH} history." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Use Python 3.9
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9"

      - name: Update Package Version
        run: uv version "$RELEASE_VERSION"

      - name: Run Tests
        run: uv run pytest tests/ -q -m "not live"

      - name: Run Import Smoke Test
        run: |
          uv run python -c "from tardis_dev import DEFAULT_ENDPOINT, DEFAULT_DATASETS_ENDPOINT, DEFAULT_CACHE_DIR, Channel, Response, replay, download_datasets, download_datasets_async, get_exchange_details, get_exchange_details_async, clear_cache, default_file_name; print('OK')"

      - name: Build Package
        run: uv build --no-sources

      - name: Upload Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Package To PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Download Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish Package
        run: uv publish --trusted-publishing always

  update-version:
    name: Commit Package Version
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Commit Version Changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "GitHub Release Bot"
          git config user.email "deploy@tardis.dev"
          uv version "$RELEASE_VERSION"
          git add pyproject.toml uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "bump version to ${RELEASE_VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
